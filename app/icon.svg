<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terras de Mitrael">
  <title>Terras de Mitrael</title>

  <!--
    O selo de cera da navegação, reduzido para caber na aba do navegador.

    O contorno do M é o desenho real da fonte Uncial Antiqua, tirado do
    arquivo da fonte e guardado aqui como traçado. Assim o ícone é a mesma
    letra do selo, e não depende de nenhuma fonte instalada em quem visita.

    A forma vem dos mesmos quatro raios do CSS (.selo-cera), porque cera
    pingada nunca é um círculo perfeito.
  -->

  <defs>
    <radialGradient id="luz" cx="34%" cy="28%" r="42%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sombra" cx="68%" cy="76%" r="52%">
      <stop offset="0" stop-color="#000" stop-opacity="0.42" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cera">
      <path d="M0 33.28A30.08 33.28 0 0 1 30.08 0A33.92 30.72 0 0 1 64 30.72A32.64 33.28 0 0 1 31.36 64A31.36 30.72 0 0 1 0 33.28Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#cera)">
    <path d="M0 0h64v64H0z" fill="#7b2028" />
    <path d="M0 0h64v64H0z" fill="url(#luz)" />
    <path d="M0 0h64v64H0z" fill="url(#sombra)" />
  </g>

