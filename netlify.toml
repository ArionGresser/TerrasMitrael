# Instruções para o Netlify construir e publicar o site.

[build]
  # Comando que gera o site
  command = "npm run build"
  # Pasta com o resultado pronto (criada pelo comando acima)
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Cabeçalhos de segurança aplicados a todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Mídia que a gente troca na mão: imagem, som e música.
#
# Uma hora de folga é o bastante para a visita inteira acontecer sem baixar
# nada duas vezes, que é o que importa em conexão fraca. Depois disso o
# navegador pergunta antes de reusar, e uma imagem substituída aparece.
#
# Aqui já esteve "um ano, imutável", e isso quebrou o site de um jeito difícil
# de achar. O Netlify carimba o mesmo cabeçalho na resposta de arquivo não
# encontrado: quem abriu uma página que apontava para uma imagem ainda não
# enviada guardou o erro por um ano, e "imutável" quer dizer que o navegador
# nem volta para perguntar. Foi o que aconteceu com os retratos do Johnny e da
# Lily. Um ano só vale para endereço que muda junto com o conteúdo, e nenhum
# destes muda.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sons/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/musicas/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Estes o Next.js nomeia com a impressão digital do conteúdo: mudou o arquivo,
# mudou o endereço. Aqui um ano imutável é seguro e é o que deve ser.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
